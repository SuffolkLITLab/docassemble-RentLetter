metadata:
  title: Ask your new landlord where to pay rent after foreclosure
  short title: Rent after foreclosure
  description: |
    Do you rent a home in Massachusetts that was sold in foreclosure?
    Foreclosure is when a lender sells a home because the owner did not pay
    the home loan. Make a letter to ask the new owner where to send your rent.
    You can also tell the owner about repairs your home needs.
  can_I_use_this_form: |
    Use this letter if you rent a home in Massachusetts and the foreclosure
    sale is finished. You need the new owner's name and address.
    This letter does not stop an eviction, which is a court case to make you
    leave your home. It does not decide how much rent you owe.
  before_you_start: |
    Have the new owner's name and address and your home's address.
    Make a list of any repairs you want the owner to make.
  when_you_are_finished: |
    Read, print, and sign your letter. Send it to the new owner.
    Keep a copy and proof that you sent it. This tool does not send the
    letter or pay rent for you.
  authors:
  - Angela
  - Suffolk LIT Lab
  jurisdiction: NAM-US-US+MA
  languages:
  - en
  LIST_topics: &id001
  - HO-08-06-00-00
  tags: *id001
  help_page_url: https://www.masslegalhelp.org/housing-apartments-shelter/foreclosure/what-do-first
  help_page_title: What to do first after foreclosure
  form_titles:
  - Letter to the new owner after foreclosure
  form_numbers: []
  allowed_courts: []
  typical_role: na
