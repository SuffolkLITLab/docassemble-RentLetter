---
code: |
  AL_DEFAULT_COUNTRY = "US"
  AL_DEFAULT_STATE = "MA"
  al_form_type = "letter"
---
features:
  cache documents: False
  tagged pdf: True
---
objects:
  - users: ALPeopleList.using(target_number=1)
---
objects:
  - new_owner: ALIndividual
---
sections:
  - review_rent_letter: Review your answers
---
initial: True
code: |
  # Rebuild downloads after an answer is edited.
  undefine("rent_letter_document")
---
mandatory: True
code: |
  al_intro_screen
  rent_letter_intro
  if not foreclosure_complete:
    foreclosure_help
  users[0].name.first
  users[0].address.address
  new_owner.name.first
  new_owner.address.address
  contact_information
  has_repairs
  date_sent
  rent_letter_preview
  rent_letter_download
---
id: rent letter introduction
continue button field: rent_letter_intro
question: |
  Write to your new landlord
subquestion: |
  This letter asks the new owner where to send your rent after foreclosure.
  Foreclosure is when a lender sells a home because the owner did not pay
  the home loan.
  You can also tell them about repairs your home needs.

  You will get a letter to print, sign, and send. This tool does not send it for you.
---
id: foreclosure status
question: |
  Is the foreclosure sale finished?
subquestion: |
  A sale to the highest bidder (an auction) is not the last step.
  The foreclosure deed must also be signed. A deed is a document that
  transfers ownership of the home. [Learn how to check ownership](https://www.masslegalhelp.org/housing-apartments-shelter/foreclosure/what-do-first).
fields:
  - The foreclosure sale is finished and I know the new owner's name and address: foreclosure_complete
    datatype: yesnoradio
---
id: check the owner first
event: foreclosure_help
question: |
  Check who owns your home first
subquestion: |
  If the foreclosure sale is not finished, keep paying your current landlord.
  If it is finished, find out who the new owner is before using this letter.

  [Find out who the owner is](https://www.masslegalhelp.org/housing-apartments-shelter/foreclosure/what-do-first).
buttons:
  - Start over: restart
  - Leave: exit
---
id: new owner name
question: |
  Who is the new owner?
subquestion: |
  Copy the name from the ownership notice or deed. A bank or company can be the owner.
fields:
  - New owner's full name: new_owner.name.first
---
id: new owner mailing address
question: |
  Where will you send the letter?
fields:
  - Street address: new_owner.address.address
  - Unit or suite: new_owner.address.unit
    required: False
  - City: new_owner.address.city
  - State: new_owner.address.state
  - ZIP code: new_owner.address.zip
---
id: rent letter contact information
question: |
  How can the new owner reach you?
subquestion: |
  Your rental address will be on the letter. You can also add a phone number,
  email address, or other contact instructions. Leave this blank to use mail only.
fields:
  - Other ways to reach you: contact_information
    input type: area
    required: False
---
id: repair details
question: |
  Does your home need repairs?
fields:
  - Do you want to tell the new owner about repairs in this letter?: has_repairs
    datatype: yesnoradio
  - Describe the problems: conditions_with_property
    input type: area
    show if: has_repairs
    help: |
      For example, describe a leak, broken lock, pests, or a problem with heat.
      Say where each problem is. Use your own words.
---
id: planned delivery
question: |
  When will you send your letter?
fields:
  - Date: date_sent
    datatype: date
    default: ${ today() }
  - How will you send it?: delivery_method
    choices:
      - Mail: mail
      - Hand delivery: hand delivery
---
id: rent letter preview
question: |
  Review your letter
subquestion: |
  Check the names, addresses, and repairs. There is a blank line
  for you to sign after you print the letter.

  ${ rent_letter_document }

  ${ action_button_html(url_action('review_rent_letter'), label='Edit answers') }
continue button field: rent_letter_preview
---
id: rent letter review
event: review_rent_letter
question: |
  Review your answers
review:
  - Edit: users[0].name.first
    button: |
      Your name: ${ users[0] }
  - Edit: users[0].address.address
    button: |
      Rental address: ${ users[0].address.on_one_line() }
  - Edit: new_owner.name.first
    button: |
      New owner: ${ new_owner.name.first }
  - Edit: new_owner.address.address
    button: |
      New owner's address: ${ new_owner.address.on_one_line() }
  - Edit: contact_information
    button: |
      Other contact information: ${ contact_information or 'Mail only' }
  - Edit: has_repairs
    button: |
      Tell the owner about repairs: ${ word(yesno(has_repairs)) }
      % if has_repairs:
      ${ conditions_with_property }
      % endif
  - Edit: date_sent
    button: |
      Send on: ${ date_sent }
  - Edit: delivery_method
    button: |
      Delivery: ${ delivery_method }
---
attachment:
  variable name: rent_letter_document
  name: Letter to your new landlord
  filename: letter_to_new_landlord
  docx template file: rent_letter.docx
---
id: rent letter download
event: rent_letter_download
question: |
  Download and send your letter
subquestion: |
  1. Download your letter. Check that it is right.
  2. Print and sign it. Update the date if you send it on a different day.
  3. Send it to the new owner. Keep a copy and proof that you sent it.

  This letter does not pay your rent. If the new owner will not accept rent,
  [read what to do next](https://www.masslegalhelp.org/housing-apartments-shelter/foreclosure/what-do-first).
  If you get a notice to leave your home or court papers, get help right away.

  ${ action_button_html(url_action('review_rent_letter'), label='Edit answers') }
attachment code: rent_letter_document
